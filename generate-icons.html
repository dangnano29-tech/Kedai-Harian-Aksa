<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h2>Klik tombol lalu simpan setiap gambar ke folder <code>icons/</code></h2>
<canvas id="c"></canvas>
<br><br>
<button onclick="generateAll()">Generate Semua Ikon</button>
<div id="result" style="display:flex;flex-wrap:wrap;gap:16px;margin-top:20px"></div>

<script>
function generateAll(){
  const sizes = [72,96,128,144,152,192,384,512];
  const container = document.getElementById('result');
  container.innerHTML = '';

  sizes.forEach(size => {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Background gradient hijau
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#064E34');
    grad.addColorStop(1, '#0E8C60');

    // Rounded rectangle
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Ikon toko sederhana
    ctx.fillStyle = '#FFFFFF';
    const s = size;

    // Atap
    ctx.beginPath();
    ctx.moveTo(s*0.1, s*0.42);
    ctx.lineTo(s*0.5, s*0.15);
    ctx.lineTo(s*0.9, s*0.42);
    ctx.closePath();
    ctx.fill();

    // Badan toko
    ctx.fillRect(s*0.18, s*0.42, s*0.64, s*0.42);

    // Pintu
    ctx.fillStyle = '#0E8C60';
    ctx.fillRect(s*0.4, s*0.55, s*0.2, s*0.29);

    // Jendela kiri
    ctx.fillRect(s*0.24, s*0.5, s*0.1, s*0.1);
    // Jendela kanan
    ctx.fillRect(s*0.66, s*0.5, s*0.1, s*0.1);

    // Teks "KA" di bawah
    if(size >= 128){
      ctx.fillStyle = '#E8AA42';
      ctx.font = `bold ${s*0.11}px Poppins, Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('KA', s*0.5, s*0.92);
    }

    // Tombol download
    const wrapper = document.createElement('div');
    wrapper.style.textAlign = 'center';

    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/png');
    img.style.width = size + 'px';
    img.style.height = size + 'px';
    img.style.border = '1px solid #ccc';
    img.style.borderRadius = '12px';

    const btn = document.createElement('a');
    btn.href = canvas.toDataURL('image/png');
    btn.download = `icon-${size}.png`;
    btn.textContent = `Download ${size}x${size}`;
    btn.style.display = 'block';
    btn.style.marginTop = '6px';
    btn.style.padding = '4px 8px';
    btn.style.background = '#0A6847';
    btn.style.color = '#fff';
    btn.style.textDecoration = 'none';
    btn.style.borderRadius = '6px';
    btn.style.fontSize = '12px';

    wrapper.appendChild(img);
    wrapper.appendChild(btn);
    container.appendChild(wrapper);
  });
}
</script>
</body>
</html>
